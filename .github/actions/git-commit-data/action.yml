name: Commit data files via PR (async auto-merge via label)
description: |
  Stage an explicit allowlist of paths, short-circuit if there is no diff,
  commit on a unique data-bot branch, push that branch, and open a PR
  against main with the `auto-merge` label so `auto-merge-bot.yml`
  enables auto-merge asynchronously.

  Why this exists (AGN-858 / AGN-861): main is a protected branch — direct
  `git push origin main` from a workflow returns GH006. The previous
  pull-rebase-push retry loop (6× exponential backoff) failed identically
  on every attempt because the protection rule, not transient ref drift,
  was the blocker. Switching to PR + auto-merge respects the protection
  rule without requiring operator-side rule edits.

  Hardening (2026-05-18, twitter-cancellation root cause): the action
  USED to call `gh pr merge --auto` inline after `gh pr create`. That
  call hung indefinitely when concurrent data PRs queued up — see
  docs/forensic/twitter-cancellation-2026-05-17.md — which let the
  90-minute job timeout fire on collectors that had already finished in
  90 seconds. Fix: drop the inline `gh pr merge --auto` and rely on the
  label-driven `auto-merge-bot.yml` workflow (triggered by
  `pull_request_target` on label / open / sync) to enable auto-merge
  out-of-band. Data branches still merge once required checks pass,
  but the data-collection workflow exits cleanly within seconds.

  Path allowlist is required (CLAUDE.md anti-pattern: never `git add -A`).
  Calling workflows must declare:
      permissions:
        contents: write
        pull-requests: write

inputs:
  paths:
    description: Newline-separated list of paths to git add (NEVER use globs covering untracked dirs).
    required: true
  message:
    description: Commit message.
    required: true
  actor-name:
    description: git config user.name
    required: false
    default: trendingrepo-bot
  actor-email:
    description: git config user.email
    required: false
    default: bot@trendingrepo.local
  branch-prefix:
    description: |
      Prefix for the auto-generated data-bot branch. The full branch name
      is "<branch-prefix>/<workflow-slug>-<run-id>-<run-attempt>".
      Override only if collisions appear; the default is fine.
    required: false
    default: "data"
  pr-label:
    description: |
      Comma-separated labels applied to the auto-generated PR. The
      `auto-merge` label is what `auto-merge-bot.yml` keys on — drop it
      only when you want the PR to sit open for manual review (e.g. a
      one-off backfill that needs human eyes). The `automation` label
      is purely descriptive for the activity feed.
    required: false
    default: "automation,auto-merge"
  ignore-missing:
    description: |
      When "true", missing paths in the allowlist are silently skipped
      (matches the legacy `git add ... 2>/dev/null || true` pattern used
      by cron-agent-commerce, where some sub-fetchers may not produce
      output every run). Default false: missing paths fail loud.
    required: false
    default: "false"
  gh-token:
    description: |
      Token used for `git push` and `gh pr create` / `gh pr merge`.
      Defaults to the workflow-provided GITHUB_TOKEN. To allow the
      auto-generated PR to trigger required status checks
      (workflow_run / pull_request), pass a fine-grained PAT or
      GitHub App token via a repo secret — GitHub deliberately
      suppresses workflow triggers for actions performed by
      GITHUB_TOKEN to prevent infinite loops, which leaves data
      PRs stuck waiting for branch-protection checks that will
      never run. Empty string falls back to GITHUB_TOKEN.
      See docs/DATA-BOT-PAT-SETUP.md.
    required: false
    default: ${{ github.token }}

outputs:
  committed:
    description: "true if a commit + PR was created; false on no-diff."
    value: ${{ steps.do-commit.outputs.committed }}
  files_changed:
    description: "Number of paths in the commit (0 when no commit)."
    value: ${{ steps.do-commit.outputs.files_changed }}
  pr_url:
    description: "URL of the auto-generated PR (empty when no commit)."
    value: ${{ steps.do-commit.outputs.pr_url }}

runs:
  using: composite
  steps:
    - name: Commit and open auto-merge PR
      id: do-commit
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_ACTOR_NAME: ${{ inputs.actor-name }}
        INPUT_ACTOR_EMAIL: ${{ inputs.actor-email }}
        INPUT_BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        INPUT_PR_LABEL: ${{ inputs.pr-label }}
        INPUT_IGNORE_MISSING: ${{ inputs.ignore-missing }}
        WORKFLOW_NAME: ${{ github.workflow }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        # `gh` reads GH_TOKEN automatically; the calling workflow MUST
        # declare permissions: { contents: write, pull-requests: write }.
        # The `|| github.token` fallback handles a workflow that wires
        # `gh-token: ${{ secrets.DATA_BOT_TOKEN }}` while the secret is
        # unset on a fork or pre-rollout repo — empty string would
        # otherwise unauthenticate `gh` entirely.
        GH_TOKEN: ${{ inputs.gh-token != '' && inputs.gh-token || github.token }}
      run: |
        set -euo pipefail
        git config user.name  "$INPUT_ACTOR_NAME"
        git config user.email "$INPUT_ACTOR_EMAIL"

        # Stage each path on its own line. Empty / commented lines skipped.
        # `xargs` is intentionally avoided — paths may contain spaces.
        while IFS= read -r p; do
          p="${p#"${p%%[![:space:]]*}"}"   # trim leading whitespace
          p="${p%"${p##*[![:space:]]}"}"   # trim trailing whitespace
          [[ -z "$p" || "$p" == \#* ]] && continue
          if [[ "$INPUT_IGNORE_MISSING" == "true" ]]; then
            git add -- "$p" 2>/dev/null || true
          else
            git add -- "$p"
          fi
        done <<< "$INPUT_PATHS"

        if git diff --quiet --staged; then
          echo "no changes - skipping commit"
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "files_changed=0" >> "$GITHUB_OUTPUT"
          echo "pr_url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        FILES_CHANGED=$(git diff --staged --name-only | wc -l | tr -d ' ')
        git commit -m "$INPUT_MESSAGE"

        # Build a unique branch name. Workflow name → lowercase slug
        # ([a-z0-9-] only). run-id + run-attempt guarantee uniqueness
        # across reruns so we never collide with a prior open PR.
        SLUG=$(printf '%s' "$WORKFLOW_NAME" \
          | tr '[:upper:]' '[:lower:]' \
          | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
        if [[ -z "$SLUG" ]]; then SLUG="data-bot"; fi
        BRANCH="${INPUT_BRANCH_PREFIX}/${SLUG}-${RUN_ID}-${RUN_ATTEMPT}"
        echo "data-bot branch: $BRANCH"

        # Push the commit to the data-bot branch (force-with-lease in case
        # of a rerun colliding on the same name — should not happen given
        # run-attempt suffix, but cheap insurance).
        #
        # Push to an explicit token-embedded URL rather than reusing the
        # remote configured by actions/checkout (which is bound to
        # GITHUB_TOKEN via http.extraheader). When GH_TOKEN is a PAT or
        # GitHub App token, the resulting push is attributed to that
        # identity, which lets workflow_run / pull_request triggers fire
        # on the auto-generated data PR — GITHUB_TOKEN-authored events
        # are deliberately suppressed by GitHub to prevent infinite
        # loops, which leaves data PRs stuck waiting for required status
        # checks that never run. (AGN-861 follow-up: 30+ data PRs stalled.)
        # The `-c http.extraheader=` empties the checkout-configured
        # header so the URL credential is the one git actually sends.
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git -c http.extraheader= push --force-with-lease "$PUSH_URL" "HEAD:refs/heads/${BRANCH}"

        # Open the PR. Body intentionally minimal — automation noise stays
        # out of the activity feed but operators can click through to the
        # run for full logs.
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
        PR_BODY=$(printf 'Automated data refresh from `%s`.\n\n- Files changed: %s\n- Run: %s\n\nThe `auto-merge` label is set; `auto-merge-bot.yml` enables\nauto-merge asynchronously, which avoids the `gh pr merge --auto`\nhang surface that timed out Twitter collectors at 90 min (see\n`docs/forensic/twitter-cancellation-2026-05-17.md`). PR merges once\nrequired status checks pass.\n' \
          "$WORKFLOW_NAME" "$FILES_CHANGED" "$RUN_URL")

        PR_CREATE_ARGS=(
          --base main
          --head "$BRANCH"
          --title "$INPUT_MESSAGE"
          --body "$PR_BODY"
        )
        if [[ -n "$INPUT_PR_LABEL" ]]; then
          PR_CREATE_ARGS+=(--label "$INPUT_PR_LABEL")
        fi

        # `gh pr create` returns the PR URL on stdout. If the repo has
        # "Allow GitHub Actions to create and approve pull requests"
        # disabled (default for new repos), this fails with a GraphQL
        # permission error. The data branch is ALREADY pushed at this
        # point, so the data is durable — surface the failure as a
        # warning and let the operator open the PR manually rather than
        # failing the whole job (AGN-803 follow-up to AGN-858/861).
        #
        # Note (2026-05-18): we DELIBERATELY do NOT call `gh pr merge
        # --auto` here. That call queues on required status checks and
        # blocks the runner for up to the job timeout when many data
        # PRs are open, which is what was killing collect-twitter.yml.
        # The `auto-merge` label applied above triggers
        # `auto-merge-bot.yml` (pull_request_target: labeled) which
        # enables auto-merge in a separate, short-lived workflow — same
        # end state, no blocking on this runner.
        if PR_URL=$(gh pr create "${PR_CREATE_ARGS[@]}" 2>&1); then
          echo "opened PR: $PR_URL"
          echo "auto-merge label applied — auto-merge-bot.yml will enable async."
        else
          echo "::warning::gh pr create failed for ${BRANCH}: ${PR_URL}. Data branch is pushed but no PR was opened. Operator must enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests', or open the PR manually from ${BRANCH}."
          PR_URL=""
        fi

        echo "committed=true" >> "$GITHUB_OUTPUT"
        echo "files_changed=${FILES_CHANGED}" >> "$GITHUB_OUTPUT"
        echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
