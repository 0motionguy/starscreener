name: nitter-health-check

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - run: node scripts/check-nitter-health.mjs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Commit nitter status update
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          message: "chore: nitter health update"
          paths: |
            config/nitter-instances.json
