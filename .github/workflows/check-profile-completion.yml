name: Profile completion check

# Audits every top-100 repo's profile completeness (required fields +
# cross-source coverage + delta freshness + enrichment) and writes a
# prioritized fix queue at data/profile-completion-queue.json.
#
# The queue is consumed by:
#   - enrich-repo-profiles.yml (--queue) → re-enriches repos with missing
#     description/language/topics
#   - sweep-cross-source-mentions.yml (--queue) → re-fetches mentions for
#     under-scanned repos (6+ silent platforms of 11)
#
# Cadence: every 30 minutes UTC. Sequencing: queue lands at :00 / :30 so
# the :41 enrich-repo-profiles run consumes a fresh file.
#
# Cost: pure CPU + JSON-read, no GitHub API calls. ~15 s wall on top mode.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "audit mode"
        required: false
        default: "top"
        type: choice
        options:
          - top
          - catchup
      top_n:
        description: "top-N override (mode=top only)"
        required: false
        default: "100"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-completion-check
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run completion check
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          MODE="${{ github.event.inputs.mode || 'top' }}"
          TOP_N="${{ github.event.inputs.top_n || '100' }}"
          npx tsx scripts/check-profile-completion.ts --mode "$MODE" --top "$TOP_N"

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          actor-email: "bot@trendingrepo.com"
          message: "chore(data): refresh profile-completion queue ${{ steps.ts.outputs.value }}"
          ignore-missing: "true"
          paths: |
            data/profile-completion-queue.json
            data/_meta/profile-completion-check.json
