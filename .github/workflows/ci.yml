name: CI

# PR/push gate. Runs the full guard + test + build matrix shipped this
# session: typecheck, 5 lint guards (lint:guards), the V3 token-budget
# guard, 93 vitest tests (test:hooks), the existing node:test suite (test),
# a production next build, and the Playwright smoke harness against
# next start. No secrets, no scheduled runs — strictly a gate.
on:
  pull_request:
    branches: [main]
    # Data-only PRs still need this workflow to create the branch-protected
    # "Typecheck, guards, tests, build, e2e" context. The gate job below
    # classifies the diff and fast-passes when only data paths changed; the
    # lightweight `data-pr-validate` workflow does the JSON/security checks.
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same ref when a newer commit lands. PRs
# typically rebase or push fixups several times before merge; old runs are
# wasted CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PR paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      data_only: ${{ steps.paths.outputs.data_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event; full CI required"
            exit 0
          fi

          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --prune origin "${{ github.base_ref }}"

          mapfile -t changed < <(git diff --name-only "$base...HEAD" || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "no changed paths detected; full CI required"
            exit 0
          fi

          data_count=0
          non_data_count=0
          for f in "${changed[@]}"; do
            case "$f" in
              data/*|.data/*)
                data_count=$((data_count + 1))
                ;;
              *)
                non_data_count=$((non_data_count + 1))
                ;;
            esac
          done

          if [ "$data_count" -gt 0 ] && [ "$non_data_count" -eq 0 ]; then
            echo "data_only=true" >> "$GITHUB_OUTPUT"
            echo "data-only PR: $data_count path(s)"
          else
            echo "data_only=false" >> "$GITHUB_OUTPUT"
            echo "full CI required: $data_count data path(s), $non_data_count non-data path(s)"
          fi

  gate:
    name: Typecheck, guards, tests, build, e2e
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Data-only fast path
        if: needs.classify.outputs.data_only == 'true'
        run: echo "Data-only PR; full CI is intentionally skipped after data-pr-validate handles JSON/path checks."

      - name: Checkout
        if: needs.classify.outputs.data_only != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Node 22 matches engines.node in package.json. The project uses Next
      # 15 + React 19 + Vitest 2 — all expect Node 20+ at minimum.
      - name: Setup Node 22
        if: needs.classify.outputs.data_only != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: needs.classify.outputs.data_only != 'true'
        run: npm ci

      # Step 1: typecheck. Strict tsc --noEmit. Fails fast on type drift
      # before we burn time on tests.
      - name: Typecheck
        if: needs.classify.outputs.data_only != 'true'
        run: npm run typecheck

      # Step 2: 5 chained CI guards (tokens, err-message echoes, zod on
      # mutating routes, route runtime declared, error envelope shape).
      # See package.json scripts.lint:guards.
      - name: Lint guards
        if: needs.classify.outputs.data_only != 'true'
        run: npm run lint:guards

      # Step 3: V3 token-budget guard. Snapshots V1 alias-name counts in
      # scripts/_v3-token-baseline.json and fails when any pattern grows.
      # Prevents regression of the V3 design sweep.
      - name: V3 token budget
        if: needs.classify.outputs.data_only != 'true'
        run: node scripts/check-v3-token-budget.mjs

      # Step 4: 93 vitest tests (hooks, components, lib).
      - name: Vitest (hooks/components/lib)
        if: needs.classify.outputs.data_only != 'true'
        run: npm run test:hooks

      # Step 5: existing node:test + tsx --test suites (scrapers, pipeline,
      # twitter collector, tools, portal). Same set developers run with
      # `npm test`.
      - name: Node test suite
        if: needs.classify.outputs.data_only != 'true'
        run: npm test

      # Step 6: Playwright. Requires a built + running production server.
      # Cold-compile dev mode would blow the 30s test timeout in
      # playwright.config.ts on the first hit per route — production builds
      # serve every page sub-second, which is what the timeout assumes.
      # Self-hosted runner has playwright deps pre-installed (apt 2026-05-13).
      # --with-deps removed: needs root, ghrunner doesn't have passwordless sudo.
      - name: Install Playwright (chromium)
        if: needs.classify.outputs.data_only != 'true'
        run: npx playwright install chromium

      - name: Seed Playwright repo fixtures
        if: needs.classify.outputs.data_only != 'true'
        run: node scripts/seed-e2e-repos.mjs

      - name: Build (production)
        if: needs.classify.outputs.data_only != 'true'
        timeout-minutes: 12
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Bundle size check (T3.3 — warn at >300 KB per client chunk)
        if: needs.classify.outputs.data_only != 'true'
        # Catches accidental client-side bundling of heavy libs. Annotation-
        # only; never fails the build. Tighten threshold or fail-on-overage
        # once the bundle stabilizes.
        shell: bash
        run: |
          THRESHOLD_BYTES=$((300 * 1024))
          oversized=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            size=$(stat -c '%s' "$f" 2>/dev/null || stat -f '%z' "$f")
            if [ "$size" -gt "$THRESHOLD_BYTES" ]; then
              echo "::warning file=$f::Client chunk $f is $((size/1024)) KB (>300 KB threshold)"
              oversized=$((oversized + 1))
            fi
          done < <(find .next/static/chunks -name "*.js" 2>/dev/null)
          if [ "$oversized" -eq 0 ]; then
            echo "Bundle size check OK — all client chunks under 300 KB"
          else
            echo "Bundle size: $oversized client chunk(s) exceed 300 KB (warning, not failing)"
          fi

      # Background next start on port 3023 (the project's canonical port —
      # matches scripts.start, scripts.dev, and the playwright config
      # default). Wait until the port answers before we kick off the test
      # run; gives the runtime up to 60s to come up.
      - name: Start production server
        if: needs.classify.outputs.data_only != 'true'
        env:
          # Smoke harness has no GITHUB_TOKEN / CRON_SECRET — env.ts's
          # production fail-closed would 500 every page request without
          # this override. Read by both the legacy STARSCREENER_* and new
          # TRENDINGREPO_* names during the brand migration.
          TRENDINGREPO_ALLOW_MISSING_ENV: "true"
          STARSCREENER_ALLOW_MISSING_ENV: "true"
        # Port 13023 (not 3023) because the VPS self-hosted runner host already
        # binds 127.0.0.1:3023 → toolbox-trendingrepo-1 container (production
        # trendingrepo). Use 13023 to avoid the conflict during CI test runs.
        run: |
          STARSCREENER_BASE_URL=http://localhost:13023 nohup npx next start -p 13023 > .next-server.log 2>&1 &
          echo $! > .next-pid
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:13023/ >/dev/null 2>&1; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server failed to start within 60s" >&2
          cat .next-server.log >&2 || true
          exit 1

      # STARSCREENER_BASE_URL is honored by playwright.config.ts: when set,
      # the config skips its built-in webServer block and assumes the
      # server is already running (which it is, from the previous step).
      - name: Playwright smokes
        if: needs.classify.outputs.data_only != 'true'
        env:
          STARSCREENER_BASE_URL: http://localhost:13023
        # Gate the functional smoke specs. The visual screenshot suite under
        # tests/e2e/visual needs committed Linux baselines before it can run
        # reliably on a clean CI worker.
        run: npm run test:e2e -- --reporter=line --grep-invert "V3 visual surfaces"

      - name: Stop production server
        if: always() && needs.classify.outputs.data_only != 'true'
        run: |
          if [ -f .next-pid ]; then
            kill "$(cat .next-pid)" 2>/dev/null || true
            rm -f .next-pid
          fi

  db-migrate:
    name: PG17 migration replay + schema assertion
    needs: classify
    if: needs.classify.outputs.data_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Clean PostgreSQL 17 so the whole drizzle/ migration set is replayed from
    # zero on every PR — a broken/forgotten migration fails here, not in prod.
    # No real secrets: a throwaway local database, DI/fakes cover Stripe+Clerk.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trendingrepo
          POSTGRES_PASSWORD: trendingrepo
          POSTGRES_DB: trendingrepo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trendingrepo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # DIRECT_URL is what drizzle-kit migrate uses (unpooled). Both point at
      # the throwaway CI database.
      DATABASE_URL: postgres://trendingrepo:trendingrepo@localhost:5432/trendingrepo_test
      DIRECT_URL: postgres://trendingrepo:trendingrepo@localhost:5432/trendingrepo_test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # drizzle-kit migrate applies the .sql files (it does NOT import the
      # schema TS, so no server-only shim is needed). Migration 0000 creates
      # the `tr` schema, so we don't pre-create it.
      - name: Drizzle migration replay (clean PG17)
        run: npm run db:migrate

      - name: Assert tr.* objects + repair columns exist
        run: node scripts/assert-db-schema.mjs

  # MCP server is a separate package with its own lockfile under mcp/.
  # Kept as a sibling job (was already in the previous ci.yml) so a
  # broken MCP build still gates PRs without serializing onto the main
  # gate job above.
  mcp-build:
    name: MCP server build
    needs: classify
    if: needs.classify.outputs.data_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Build MCP server
        working-directory: mcp
        run: npm run build
