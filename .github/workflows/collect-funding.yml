name: Collect Funding Signals
on:
  # Manual-only: HOSTUP worker/runtime owns production freshness; GitHub is kept for explicit backfills.
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source list (techcrunch,venturebeat,sifted)'
        default: 'techcrunch,venturebeat,sifted'
      dry_run:
        description: 'Dry run'
        default: 'false'

# Required so the auto-commit step (`git push`) can write data/funding-news.json
# back to main. Without this the scraper runs + produces fresh signal but the
# final push gets `403 denied to github-actions[bot]`.
permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run scrape:funding -- --sources ${{ github.event.inputs.sources || 'techcrunch,venturebeat,sifted,arstechnica,techeu,pymnts,bbc,wired,geekwire,eu-startups,siliconcanals,techstartups,techcrunch-ai,venturebeat-ai,ai-news,ai-business,the-decoder,marktechpost,unite-ai,analytics-india,mit-tech-review-ai,synced,prnewswire-vc,newcomer,ai-snake-oil,generative-value,import-ai' }} --enrich ${{ github.event.inputs.dry_run == 'true' && '--output .tmp/funding-preview.json' || '' }}
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Dual-write to TOOLBOX signal lake (funding.startup + GitHub
          # cross-link when extracted.githubUrl present). Skipped silently
          # when unset; never blocks the primary write.
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
      # SEC Form D filings — every US private round files within 15 days,
      # EDGAR full-text search filters to AI-mentioning filings only.
      # Continues on error so a flaky EDGAR doesn't blank the funding-news
      # commit step.
      - run: npm run scrape:sec-form-d ${{ github.event.inputs.dry_run == 'true' && '-- --output=.tmp/sec-form-d-preview.json' || '' }}
        timeout-minutes: 8
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Dual-write to TOOLBOX signal lake (funding.sec.formd).
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
        continue-on-error: true
      - if: github.event.inputs.dry_run != 'true'
        name: Install worker fetcher deps
        run: npm ci --prefix apps/trendingrepo-worker
      - if: github.event.inputs.dry_run != 'true'
        name: Refresh Crunchbase funding side-channel
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm --prefix apps/trendingrepo-worker run fetcher -- crunchbase
      # 2026-05-18: REMOVED — APIFY policy permanently off (see
      # docs/POLICY-NO-APIFY.md). The x-funding fetcher in
      # apps/trendingrepo-worker used Apify to scrape X/Twitter funding
      # mentions. The step was previously gated `if: false`; the dead
      # secret reference (APIFY_API_TOKEN) was the last live tie between
      # this workflow and the disabled vendor.
      #
      # Restore-path if Apify is ever re-approved: revert this commit AND
      # confirm the operator-budget decision in docs/POLICY-NO-APIFY.md.
      - if: github.event.inputs.dry_run != 'true'
        name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          actor-name: "github-actions[bot]"
          actor-email: "github-actions[bot]@users.noreply.github.com"
          message: "chore: auto-update funding signals [skip ci]"
          paths: |
            data/funding-news.json
            data/_meta/funding-news.json
            data/funding-news-sec.json
            data/unknown-mentions.jsonl
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: funding-scraper-logs
          path: .tmp/
