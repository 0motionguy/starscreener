name: Collect Funding Signals
on:
  schedule:
    # 2h cadence (was 6h). 24h-fresh KPI was sparse on the old schedule
    # because RSS sources rarely produce funding-keyword headlines on
    # every 6h tick — 2h gives us 12 chances per day instead of 4.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Comma-separated source list (techcrunch,venturebeat,sifted)'
        default: 'techcrunch,venturebeat,sifted'
      dry_run:
        description: 'Dry run'
        default: 'false'

# Required so the auto-commit step (`git push`) can write data/funding-news.json
# back to main. Without this the scraper runs + produces fresh signal but the
# final push gets `403 denied to github-actions[bot]`.
permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run scrape:funding -- --sources ${{ github.event.inputs.sources || 'techcrunch,venturebeat,sifted,arstechnica,techeu,pymnts,bbc,wired,geekwire,eu-startups,siliconcanals,techstartups,techcrunch-ai,venturebeat-ai,ai-news,ai-business,the-decoder,marktechpost,unite-ai,analytics-india,mit-tech-review-ai,synced,prnewswire-vc,newcomer,ai-snake-oil,generative-value,import-ai' }} --enrich ${{ github.event.inputs.dry_run == 'true' && '--output .tmp/funding-preview.json' || '' }}
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
      # SEC Form D filings — every US private round files within 15 days,
      # EDGAR full-text search filters to AI-mentioning filings only.
      # Continues on error so a flaky EDGAR doesn't blank the funding-news
      # commit step.
      - run: npm run scrape:sec-form-d ${{ github.event.inputs.dry_run == 'true' && '-- --output=.tmp/sec-form-d-preview.json' || '' }}
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        continue-on-error: true
      - if: github.event.inputs.dry_run != 'true'
        name: Install worker fetcher deps
        run: npm ci --prefix apps/trendingrepo-worker
      - if: github.event.inputs.dry_run != 'true'
        name: Refresh Crunchbase funding side-channel
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm --prefix apps/trendingrepo-worker run fetcher -- crunchbase
      - if: github.event.inputs.dry_run != 'true'
        name: Refresh X funding side-channel
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: npm --prefix apps/trendingrepo-worker run fetcher -- x-funding
      - if: github.event.inputs.dry_run != 'true'
        name: Commit if changed
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          actor-name: "github-actions[bot]"
          actor-email: "github-actions[bot]@users.noreply.github.com"
          message: "chore: auto-update funding signals [skip ci]"
          paths: |
            data/funding-news.json
            data/_meta/funding-news.json
            data/funding-news-sec.json
            data/unknown-mentions.jsonl
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: funding-scraper-logs
          path: .tmp/
