# 2026-05-17: switched from every-3h to 3x/day per operator. Free-providers-only
# (nitter); xcancel.com removed from rotation in config/nitter-instances.json
# because the circuit breaker stays chronically open. See docs/POLICY-NO-APIFY.md
# for the broader "no Apify" stance. Cadence + batch sizing chosen so the
# collector can finish each run before the 90-minute job timeout fires:
# 50 repos × 4 queries × ~10s nitter latency ≈ 33 min wall-clock with buffer.
# Previous every-3h × 10 repos pattern routinely timed out at 30 min (see
# run 25983611341) which prevented `writeSourceMeta()` from running and left
# twitter.json stale at `ts: 2026-05-04` for 13 consecutive days.
# Follow-up: the free-provider path is now capped at 5 repos, 2 tier-1
# queries, 1 Nitter page, and 8s per request by default. That keeps freshness
# recoverable even when instances degrade.
name: Collect Twitter Signals

on:
  schedule:
    - cron: "23 4,12,20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of repos to scan"
        required: false
        default: "5"
      mode:
        description: "Collector mode (api or direct)"
        required: false
        default: "direct"
      dry_run:
        description: "Dry run (no ingestion)"
        required: false
        default: "false"
      repos:
        description: "Comma-separated repo filters (owner/name) — empty to use priority ranking"
        required: false
        default: ""

# Needed so the auto-commit step can push .data/twitter-*.jsonl back to main.
# Vercel's serverless runtime has read-only FS, so API-mode ingest can't
# persist — we must write locally in GH Actions and commit, same as funding.
permissions:
  contents: write
  pull-requests: write

# Prevent duplicate concurrent runs from cancelling earlier successful ones.
# cancel-in-progress: false preserves the older run (which may already be
# committing data) and queues/cancels the newer trigger. Wired 2026-05-17
# per session-G W1.B Twitter diagnosis: concurrent dispatches were stomping
# on each other and reducing usable runs.
concurrency:
  group: collect-twitter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 2026-05-17: raised from 30 → 90 to match the 3x/day × 50-repo batch.
    # 50 repos × 4 queries × ~10s nitter latency ≈ 33 min, +commit pipeline
    # + fallback retry budget. 30 min was killing the job mid-collect (run
    # 25983611341).
    # Follow-up: step-level caps now bound the collector/fallback, so the job
    # only needs enough budget for install, one bounded fallback, and commit.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect Twitter signals
        id: collect_primary
        timeout-minutes: 20
        continue-on-error: true
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Provider default flipped to `nitter` 2026-05-08 after the Apify
          # `apidojo/tweet-scraper` actor returned 0 posts on every query for
          # the prior ~2 weeks (last run with non-empty payload was
          # 2026-04-23). 2026-05-17: APIFY operator policy off (see
          # docs/POLICY-NO-APIFY.md) — `nitter` is now the permanent default.
          # 2026-05-18: APIFY_API_TOKEN env reference removed from this
          # workflow entirely (was already stripped from the env block; the
          # stale "env below" comment now accurately describes "no env").
          # Re-enabling Apify requires reverting these commits AND operator
          # sign-off.
          TWITTER_COLLECTOR_PROVIDER: ${{ vars.TWITTER_COLLECTOR_PROVIDER || 'nitter' }}
          # "direct" writes to .data/twitter-*.jsonl locally (so we can commit
          # them back to main). "api" would POST to Vercel's ingest endpoint,
          # but Vercel's filesystem is read-only / ephemeral so the writes
          # would not persist to the /twitter page.
          TWITTER_COLLECTOR_MODE: ${{ github.event.inputs.mode || 'direct' }}
          TWITTER_COLLECTOR_LIMIT: ${{ github.event.inputs.limit || '5' }}
          # 4 queries per repo = full tier-1 coverage. Tier 1 is the set of
          # "impossible to fake coincidentally" signals: repo_slug (owner/name),
          # repo_url (github.com/...), package_name (pip/npm install ...),
          # homepage_url, docs_url. Package + homepage matches are often the
          # highest-signal finds — tweets saying "npm i foo" don't hit a
          # slug/url search. Hosted runners default to 10 repos per run so
          # the collector stays inside the 30-minute job timeout.
          # Effective default is intentionally smaller than the legacy notes:
          # 2 tier-1 queries, max tier 1, 1 page, and 8s per request.
          TWITTER_COLLECTOR_QUERIES_PER_REPO: ${{ vars.TWITTER_COLLECTOR_QUERIES_PER_REPO || '2' }}
          TWITTER_COLLECTOR_MAX_TIER: ${{ vars.TWITTER_COLLECTOR_MAX_TIER || '1' }}
          TWITTER_COLLECTOR_NITTER_PAGES: ${{ vars.TWITTER_COLLECTOR_NITTER_PAGES || '1' }}
          TWITTER_COLLECTOR_TIMEOUT_MS: ${{ vars.TWITTER_COLLECTOR_TIMEOUT_MS || '8000' }}
          TWITTER_COLLECTOR_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TWITTER_COLLECTOR_REPOS: ${{ github.event.inputs.repos || '' }}
          TWITTER_COLLECTOR_BASE_URL: ${{ vars.TRENDINGREPO_URL || vars.STARSCREENER_URL || 'https://trendingrepo.com' }}
          INTERNAL_AGENT_TOKEN: ${{ secrets.INTERNAL_AGENT_TOKEN }}
          # APIFY_API_TOKEN + APIFY_TWITTER_ACTOR are NOT passed (operator
          # policy permanently off as of 2026-05-17 — see
          # docs/POLICY-NO-APIFY.md). Collector relies on nitter primary +
          # cookies-web fallback. 2026-05-18 cleanup: this comment is the
          # only remaining trace; no env declarations to remove.
          TWITTER_WEB_ACCOUNTS_JSON: ${{ secrets.TWITTER_WEB_ACCOUNTS_JSON }}
          TWITTER_GRAPHQL_SEARCH_QUERY_ID: ${{ vars.TWITTER_GRAPHQL_SEARCH_QUERY_ID }}
          # TWITTER_WEB_DEBUG: "1"  # uncomment when diagnosing empty responses
          TWITTER_COLLECTOR_RUN_ID: "gh-actions-${{ github.run_id }}-${{ github.run_attempt }}"
        run: npm run collect:twitter

      # Third-tier fallback: when Apify is dead AND Nitter fails (instances
      # 503ing or returning empty), retry with the cookies-backed web provider
      # (`TwitterWebProvider` at scripts/collect-twitter-signals.ts:821). Only
      # fires if the operator has populated TWITTER_FALLBACK_COOKIES — empty
      # secret short-circuits via `env != ''` so we don't waste a run trying
      # to log in with no creds. Wired 2026-05-08 per forensic audit:
      # Nitter has been default since 2026-05-08 and we need a recovery path
      # for Nitter outages without manual intervention.
      # Follow-up: the step now gates on the primary step outcome, and the
      # shell guard checks TWITTER_WEB_ACCOUNTS_JSON before invoking provider=web.
      - name: Web-provider fallback (cookies-gated)
        id: web_fallback
        if: steps.collect_primary.outcome == 'failure' && !cancelled()
        timeout-minutes: 15
        continue-on-error: true
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TWITTER_COLLECTOR_PROVIDER: web
          TWITTER_COLLECTOR_MODE: ${{ github.event.inputs.mode || 'direct' }}
          TWITTER_COLLECTOR_LIMIT: ${{ github.event.inputs.limit || '5' }}
          TWITTER_COLLECTOR_QUERIES_PER_REPO: ${{ vars.TWITTER_COLLECTOR_QUERIES_PER_REPO || '2' }}
          TWITTER_COLLECTOR_MAX_TIER: ${{ vars.TWITTER_COLLECTOR_MAX_TIER || '1' }}
          TWITTER_COLLECTOR_TIMEOUT_MS: ${{ vars.TWITTER_COLLECTOR_TIMEOUT_MS || '8000' }}
          TWITTER_COLLECTOR_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TWITTER_COLLECTOR_REPOS: ${{ github.event.inputs.repos || '' }}
          TWITTER_COLLECTOR_BASE_URL: ${{ vars.TRENDINGREPO_URL || vars.STARSCREENER_URL || 'https://trendingrepo.com' }}
          INTERNAL_AGENT_TOKEN: ${{ secrets.INTERNAL_AGENT_TOKEN }}
          TWITTER_WEB_ACCOUNTS_JSON: ${{ secrets.TWITTER_WEB_ACCOUNTS_JSON }}
          TWITTER_GRAPHQL_SEARCH_QUERY_ID: ${{ vars.TWITTER_GRAPHQL_SEARCH_QUERY_ID }}
          TWITTER_COLLECTOR_RUN_ID: "gh-actions-${{ github.run_id }}-${{ github.run_attempt }}-webfb"
        run: |
          if [ -z "${TWITTER_WEB_ACCOUNTS_JSON:-}" ]; then
            echo "::warning::TWITTER_WEB_ACCOUNTS_JSON is not configured; skipping web fallback"
            exit 1
          fi
          npm run collect:twitter -- --provider web

      - name: Compute Twitter leaderboard + consensus
        if: |
          always() && !cancelled() && github.event.inputs.dry_run != 'true' &&
          (steps.collect_primary.outcome == 'success' || steps.web_fallback.outcome == 'success')
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npm run compute:consensus

      - name: Compute commit timestamp
        # Run commit pipeline if either the primary collector succeeded OR
        # the web-provider fallback succeeded. `always() && !cancelled()` lets
        # us evaluate after a failed primary step; the success-OR-fallback
        # check ensures we only commit when one of the two produced data.
        if: |
          always() && !cancelled() && github.event.inputs.dry_run != 'true' &&
          (steps.collect_primary.outcome == 'success' || steps.web_fallback.outcome == 'success')
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit updated twitter signals
        if: |
          always() && !cancelled() && github.event.inputs.dry_run != 'true' &&
          (steps.collect_primary.outcome == 'success' || steps.web_fallback.outcome == 'success')
        # Step-level timeout: the embedded `git-commit-data` action calls
        # `gh pr merge --auto` which blocks indefinitely on required status
        # checks. Without this cap, the whole 30-min job timeout fires and
        # GH Actions cancels the run (see session-G F.2 diagnosis,
        # 2026-05-16: 10 consecutive cancelled runs caused by this exact
        # blocker). 5 min is enough to open the PR + enable auto-merge;
        # the merge itself completes asynchronously via the auto-merge bot.
        timeout-minutes: 5
        env:
          HUSKY: "0"
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          message: "chore(data): refresh twitter signals ${{ steps.ts.outputs.value }}"
          paths: |
            .data/twitter-repo-signals.jsonl
            .data/twitter-scans.jsonl
            .data/twitter-ingestion-audit.jsonl
            data/unknown-mentions.jsonl
            data/twitter-trending.json
            data/consensus-trending.json

      - name: Twitter signal-count health monitor
        if: always()
        run: |
          SIGNAL_FILE=".data/twitter-repo-signals.jsonl"
          CHECKPOINT_FILE="data/.twitter-signal-count"

          if [ ! -f "$SIGNAL_FILE" ]; then
            echo "::warning::$SIGNAL_FILE not found — skipping monitor"
            exit 0
          fi

          CURRENT=$(wc -l < "$SIGNAL_FILE" | tr -d ' ')
          PREVIOUS=0
          if [ -f "$CHECKPOINT_FILE" ]; then
            PREVIOUS=$(cat "$CHECKPOINT_FILE" | tr -d '[:space:]')
          fi

          echo "Twitter signal count: $CURRENT (was $PREVIOUS)"

          if [ "$PREVIOUS" -gt 0 ]; then
            THRESHOLD=$(( PREVIOUS * 90 / 100 ))
            if [ "$CURRENT" -lt "$THRESHOLD" ]; then
              echo "::error::Signal count dropped from $PREVIOUS to $CURRENT (>10% drop). Apify or Nitter likely failing."
              exit 2
            fi
          fi

          # Update checkpoint for next run (if current count is reasonable)
          if [ "$CURRENT" -gt 0 ]; then
            echo "$CURRENT" > "$CHECKPOINT_FILE"
          fi

          # Secondary check: meta-file age. The line-count check above can
          # PASS (e.g. 477 > 409) even when the job was cancelled BEFORE
          # `writeSourceMeta()` fired, leaving data/_meta/twitter.json stale.
          # That stale meta is what /twitter and freshness probes read, so a
          # silent failure here is a silent prod-data outage. The cron runs
          # 3x/day (every ~8h), so 6h+ is a soft warning and 24h+ is a hard
          # error. Wired 2026-05-17 after a string of cancelled runs left
          # twitter.json stuck at ts=2026-05-04 for 13 days despite the
          # line-count monitor showing PASS every run.
          META_FILE="data/_meta/twitter.json"
          if [ -f "$META_FILE" ]; then
            META_TS=$(jq -r '.ts // ""' "$META_FILE")
            if [ -n "$META_TS" ]; then
              META_EPOCH=$(date -d "$META_TS" +%s 2>/dev/null || echo "0")
              NOW_EPOCH=$(date -u +%s)
              AGE_SEC=$(( NOW_EPOCH - META_EPOCH ))
              AGE_HR=$(( AGE_SEC / 3600 ))
              echo "twitter.json age: ${AGE_HR}h (ts=${META_TS})"
              if [ "$AGE_HR" -gt 24 ]; then
                echo "::error::twitter.json is ${AGE_HR}h stale — collector is failing silently before writeSourceMeta()"
                exit 2
              elif [ "$AGE_HR" -gt 6 ]; then
                echo "::warning::twitter.json hasn't been updated in ${AGE_HR}h — collector may be crashing before writeSourceMeta()"
              fi
            else
              echo "::warning::$META_FILE has no .ts field — skipping age check"
            fi
          else
            echo "::warning::$META_FILE not found — skipping age check"
          fi

      - name: Commit health checkpoint
        if: |
          success() &&
          (steps.collect_primary.outcome == 'success' || steps.web_fallback.outcome == 'success')
        timeout-minutes: 5
        env:
          HUSKY: "0"
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          message: "ci(twitter): update signal-count checkpoint"
          branch-prefix: data-checkpoint
          paths: |
            data/.twitter-signal-count

      - name: Fail if all Twitter collectors failed
        if: |
          always() && !cancelled() &&
          steps.collect_primary.outcome != 'success' &&
          steps.web_fallback.outcome != 'success'
        run: |
          echo "::error::primary and fallback Twitter collectors failed; see collector logs"
          exit 1

      - name: Upload collector output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: twitter-collector-logs
          path: .tmp/twitter-collector*.json
          retention-days: 3
