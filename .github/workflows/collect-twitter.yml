name: Collect Twitter Signals

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of repos to scan"
        required: false
        default: "25"
      mode:
        description: "Collector mode (api or direct)"
        required: false
        default: "direct"
      dry_run:
        description: "Dry run (no ingestion)"
        required: false
        default: "false"
      repos:
        description: "Comma-separated repo filters (owner/name) — empty to use priority ranking"
        required: false
        default: ""

# Needed so the auto-commit step can push .data/twitter-*.jsonl back to main.
# Vercel's serverless runtime has read-only FS, so API-mode ingest can't
# persist — we must write locally in GH Actions and commit, same as funding.
permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect Twitter signals
        env:
          # Provider default flipped to `nitter` 2026-05-08 after the Apify
          # `apidojo/tweet-scraper` actor returned 0 posts on every query for
          # the prior ~2 weeks (last run with non-empty payload was
          # 2026-04-23; latest scheduled runs all show postsSeen: 0 across
          # 25 repos × 4 queries). Local probe with provider=nitter on the
          # same repos returned 19-20 posts/query, confirming the upstream
          # scraping path is intact and the issue is Apify-side (quota,
          # actor change, or X anti-bot blocking the residential IPs).
          # Override with `vars.TWITTER_COLLECTOR_PROVIDER` if the operator
          # restores Apify access.
          TWITTER_COLLECTOR_PROVIDER: ${{ vars.TWITTER_COLLECTOR_PROVIDER || 'nitter' }}
          # "direct" writes to .data/twitter-*.jsonl locally (so we can commit
          # them back to main). "api" would POST to Vercel's ingest endpoint,
          # but Vercel's filesystem is read-only / ephemeral so the writes
          # would not persist to the /twitter page.
          TWITTER_COLLECTOR_MODE: ${{ github.event.inputs.mode || 'direct' }}
          TWITTER_COLLECTOR_LIMIT: ${{ github.event.inputs.limit || '25' }}
          # 4 queries per repo = full tier-1 coverage. Tier 1 is the set of
          # "impossible to fake coincidentally" signals: repo_slug (owner/name),
          # repo_url (github.com/...), package_name (pip/npm install ...),
          # homepage_url, docs_url. Package + homepage matches are often the
          # highest-signal finds — tweets saying "npm i foo" don't hit a
          # slug/url search. Cost at 4 queries × 25 repos × 8 firings/day ≈
          # 800 actor runs/day ≈ ~$8/day at expected hit rate.
          TWITTER_COLLECTOR_QUERIES_PER_REPO: ${{ vars.TWITTER_COLLECTOR_QUERIES_PER_REPO || '4' }}
          TWITTER_COLLECTOR_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TWITTER_COLLECTOR_REPOS: ${{ github.event.inputs.repos || '' }}
          TWITTER_COLLECTOR_BASE_URL: ${{ vars.TRENDINGREPO_URL || vars.STARSCREENER_URL || 'https://trendingrepo.com' }}
          INTERNAL_AGENT_TOKEN: ${{ secrets.INTERNAL_AGENT_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TWITTER_ACTOR: ${{ vars.APIFY_TWITTER_ACTOR }}
          TWITTER_WEB_ACCOUNTS_JSON: ${{ secrets.TWITTER_WEB_ACCOUNTS_JSON }}
          TWITTER_GRAPHQL_SEARCH_QUERY_ID: ${{ vars.TWITTER_GRAPHQL_SEARCH_QUERY_ID }}
          # TWITTER_WEB_DEBUG: "1"  # uncomment when diagnosing empty responses
          TWITTER_COLLECTOR_RUN_ID: "gh-actions-${{ github.run_id }}-${{ github.run_attempt }}"
        run: npm run collect:twitter

      # Third-tier fallback: when Apify is dead AND Nitter fails (instances
      # 503ing or returning empty), retry with the cookies-backed web provider
      # (`TwitterWebProvider` at scripts/collect-twitter-signals.ts:821). Only
      # fires if the operator has populated TWITTER_FALLBACK_COOKIES — empty
      # secret short-circuits via `env != ''` so we don't waste a run trying
      # to log in with no creds. Wired 2026-05-08 per forensic audit:
      # Nitter has been default since 2026-05-08 and we need a recovery path
      # for Nitter outages without manual intervention.
      - name: Web-provider fallback (cookies-gated)
        id: web_fallback
        if: failure() && env.TWITTER_FALLBACK_COOKIES != ''
        env:
          TWITTER_COLLECTOR_PROVIDER: web
          TWITTER_COLLECTOR_MODE: ${{ github.event.inputs.mode || 'direct' }}
          TWITTER_COLLECTOR_LIMIT: ${{ github.event.inputs.limit || '25' }}
          TWITTER_COLLECTOR_QUERIES_PER_REPO: ${{ vars.TWITTER_COLLECTOR_QUERIES_PER_REPO || '4' }}
          TWITTER_COLLECTOR_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TWITTER_COLLECTOR_REPOS: ${{ github.event.inputs.repos || '' }}
          TWITTER_COLLECTOR_BASE_URL: ${{ vars.TRENDINGREPO_URL || vars.STARSCREENER_URL || 'https://trendingrepo.com' }}
          INTERNAL_AGENT_TOKEN: ${{ secrets.INTERNAL_AGENT_TOKEN }}
          TWITTER_FALLBACK_COOKIES: ${{ secrets.TWITTER_FALLBACK_COOKIES }}
          TWITTER_WEB_ACCOUNTS_JSON: ${{ secrets.TWITTER_WEB_ACCOUNTS_JSON }}
          TWITTER_GRAPHQL_SEARCH_QUERY_ID: ${{ vars.TWITTER_GRAPHQL_SEARCH_QUERY_ID }}
          TWITTER_COLLECTOR_RUN_ID: "gh-actions-${{ github.run_id }}-${{ github.run_attempt }}-webfb"
        run: npm run collect:twitter -- --provider web

      - name: Compute commit timestamp
        # Run commit pipeline if either the primary collector succeeded OR
        # the web-provider fallback succeeded. `always() && !cancelled()` lets
        # us evaluate after a failed primary step; the success-OR-fallback
        # check ensures we only commit when one of the two produced data.
        if: |
          always() && !cancelled() && github.event.inputs.dry_run != 'true' &&
          (success() || steps.web_fallback.outcome == 'success')
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit updated twitter signals
        if: |
          always() && !cancelled() && github.event.inputs.dry_run != 'true' &&
          (success() || steps.web_fallback.outcome == 'success')
        env:
          HUSKY: "0"
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          message: "chore(data): refresh twitter signals ${{ steps.ts.outputs.value }}"
          paths: |
            .data/twitter-repo-signals.jsonl
            .data/twitter-scans.jsonl
            .data/twitter-ingestion-audit.jsonl
            data/unknown-mentions.jsonl

      - name: Twitter signal-count health monitor
        if: always()
        run: |
          SIGNAL_FILE=".data/twitter-repo-signals.jsonl"
          CHECKPOINT_FILE="data/.twitter-signal-count"

          if [ ! -f "$SIGNAL_FILE" ]; then
            echo "::warning::$SIGNAL_FILE not found — skipping monitor"
            exit 0
          fi

          CURRENT=$(wc -l < "$SIGNAL_FILE" | tr -d ' ')
          PREVIOUS=0
          if [ -f "$CHECKPOINT_FILE" ]; then
            PREVIOUS=$(cat "$CHECKPOINT_FILE" | tr -d '[:space:]')
          fi

          echo "Twitter signal count: $CURRENT (was $PREVIOUS)"

          if [ "$PREVIOUS" -gt 0 ]; then
            THRESHOLD=$(( PREVIOUS * 90 / 100 ))
            if [ "$CURRENT" -lt "$THRESHOLD" ]; then
              echo "::error::Signal count dropped from $PREVIOUS to $CURRENT (>10% drop). Apify or Nitter likely failing."
              exit 2
            fi
          fi

          # Update checkpoint for next run (if current count is reasonable)
          if [ "$CURRENT" -gt 0 ]; then
            echo "$CURRENT" > "$CHECKPOINT_FILE"
          fi

      - name: Commit health checkpoint
        if: success()
        run: |
          if [ -n "$(git status --porcelain data/.twitter-signal-count)" ]; then
            git add data/.twitter-signal-count
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "ci(twitter): update signal-count checkpoint"
            git push
          fi

      - name: Upload collector output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twitter-collector-logs
          path: .tmp/twitter-collector*.json
          retention-days: 3
