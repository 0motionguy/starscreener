name: Cron - subdomain takeover scan

# Weekly platform security control.
# Calls /api/cron/subdomain-takeover with CRON_SECRET auth and fails loudly
# on non-200 responses so takeover drift cannot go silent.

on:
  schedule:
    - cron: "1 3 * * 1"  # Mondays 03:01 UTC (staggered off :00 burst, was 03:00)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cron-subdomain-takeover
  cancel-in-progress: false

env:
  BASE_URL: ${{ vars.TRENDINGREPO_URL || vars.STARSCREENER_URL || 'https://trendingrepo.com' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/subdomain-takeover
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is unset — refusing to fire unauthenticated"
            exit 1
          fi
          URL="$BASE_URL/api/cron/subdomain-takeover"
          code=$(curl -sS -o /tmp/subdomain-scan-out -w "%{http_code}" -X POST \
            "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          if command -v jq >/dev/null 2>&1 && jq . /tmp/subdomain-scan-out >/dev/null 2>&1; then
            jq . /tmp/subdomain-scan-out | head -c 4000
          else
            head -c 4000 /tmp/subdomain-scan-out
          fi
          echo
          if [ "$code" != "200" ]; then
            echo "::error::cron/subdomain-takeover call failed ($code)"
            exit 1
          fi
