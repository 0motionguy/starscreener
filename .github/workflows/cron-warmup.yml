name: Warm HOSTUP routes
on:
  schedule:
    # 08:00–22:00 UTC, every 5 min — keeps the EU/US working-hours window hot.
    # Outside this window traffic is sparse enough that a cold-on-first-hit is acceptable.
    - cron: "*/5 8-21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        route:
          - /
          - /market-signals
          - /tools
          - /tools/compare
          - /tools/top-10
          - /tools/tier-list
          - /tools/star-history
          - /tools/digest
          - /tools/treemap
          - /tools/watchlist
          - /funding
          - /revenue
          - /breakout
          - /categories
          - /categories/mcp
          - /collections
          - /collections/ai-agent-frameworks
          - /methodology
          - /tools/revenue-estimate
          - /repo/0motionguy/starscreener
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Probe ${{ matrix.route }}
        id: probe
        run: |
          mkdir -p .perf
          # Sanitize route for filename (replace / with __)
          SLUG=$(echo "${{ matrix.route }}" | sed 's|/|__|g')
          node scripts/probe-route.mjs \
            --base=https://trendingrepo.com \
            --route="${{ matrix.route }}" \
            --user-agent="TrendingRepo-Warmup-Cron" \
            --out=".perf/probe${SLUG}.json"
          cat ".perf/probe${SLUG}.json"
      - name: Upload route probe
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warmup-probes-${{ strategy.job-index }}
          path: .perf/probe*.json
          include-hidden-files: true
          retention-days: 14

  summarize:
    needs: warmup
    runs-on: [self-hosted, linux, x64]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .perf/raw
          pattern: warmup-probes-*
          merge-multiple: true
      - name: Merge probes
        run: |
          mkdir -p .perf
          if ls .perf/raw/probe*.json >/dev/null 2>&1; then
            jq -s '{ runAt: now | todate, results: . }' .perf/raw/probe*.json \
              > .perf/cron-warmup-summary.json
            echo "Summary:"
            jq '.results | map({ route, status, ttfbMs, edgeCache, cacheControl }) | sort_by(.route)' \
              .perf/cron-warmup-summary.json
            bad_count="$(jq '[.results[] | select((.error != null) or (.status < 200) or (.status >= 400))] | length' .perf/cron-warmup-summary.json)"
            if [ "$bad_count" -gt 0 ]; then
              echo "Warmup found ${bad_count} failing route(s):" >&2
              jq -r '.results[] | select((.error != null) or (.status < 200) or (.status >= 400)) | "\(.route) status=\(.status) error=\(.error)"' \
                .perf/cron-warmup-summary.json >&2
              exit 1
            fi
          else
            echo "No probe outputs found." >&2
            exit 1
          fi
      - name: Upload summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cron-warmup-summary
          path: .perf/cron-warmup-summary.json
          include-hidden-files: true
          retention-days: 30
