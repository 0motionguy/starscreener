name: docs-freshness

on:
  schedule:
    - cron: "0 13 * * 1"  # Mondays 13:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check-docs-freshness.mjs"
      - "scripts/check-living-docs-have-frontmatter.mjs"
      - ".github/workflows/docs-freshness.yml"

permissions:
  contents: read

concurrency:
  group: docs-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run freshness check
        run: node scripts/check-docs-freshness.mjs
      - name: Run frontmatter validity check
        run: node scripts/check-living-docs-have-frontmatter.mjs
