name: engine-inventory-check

on:
  pull_request:
    paths:
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"
      - "src/app/api/cron/**"
      - "apps/trendingrepo-worker/src/fetchers/**"
      - "scripts/derive-engine-inventory.mjs"

permissions:
  contents: read

concurrency:
  group: engine-inventory-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Re-derive engine inventory
        run: node scripts/derive-engine-inventory.mjs
      - name: Verify inventory is up-to-date
        # Output is deterministic: derive-engine-inventory.mjs writes no
        # timestamp (generated_at field removed 2026-05-05), so a clean
        # re-derive on a passing PR produces zero diff. If this step fails,
        # something in workflows/cron-routes/worker-fetchers/env-vars actually
        # changed and the committed inventory is stale.
        run: |
          if ! git diff --quiet docs/_generated/engine.json docs/_generated/engine.md; then
            echo "::error::Engine inventory is stale. Run 'npm run engine:derive' and commit the updated docs/_generated/engine.{json,md} files."
            git diff --stat docs/_generated/
            exit 1
          fi
          echo "Engine inventory up-to-date."
