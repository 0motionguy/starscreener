name: engine-inventory-refresh
on:
  schedule:
    - cron: "0 14 * * 1"  # Mondays 14:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**.yml"
      - "src/app/api/cron/**"
      - "apps/trendingrepo-worker/**"
permissions:
  contents: write
concurrency:
  group: engine-inventory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/derive-engine-inventory.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain docs/_generated/)" ]]; then
            git config user.name "engine-inventory-bot"
            git config user.email "actions@github.com"
            git add docs/_generated/
            git commit -m "chore(engine): refresh inventory $(date -u +%Y-%m-%d)"
            git push
          fi
