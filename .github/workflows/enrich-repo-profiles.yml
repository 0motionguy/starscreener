name: Refresh repo profiles

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-profile-refresh
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # Defensive: scripts/enrich-repo-profiles.mjs imports
        # _data-store-write.mjs which dynamic-imports `ioredis` when
        # REDIS_URL is set. (PR #9 boundary.)
        run: npm ci

      - name: Refresh repo profiles incrementally
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/enrich-repo-profiles.mjs --mode incremental --limit 50 --max-scans 5

      - name: Verify repo profile coverage + stale backlog
        run: node scripts/verify-repo-profile-coverage.mjs --limit=200 --rescan-days=7

      - name: Build repo autocompletion checklist
        run: node scripts/build-repo-autocompletion-checklist.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        id: commit_data
        continue-on-error: true
        uses: ./.github/actions/git-commit-data
        with:
          message: "chore(data): refresh repo profiles ${{ steps.ts.outputs.value }}"
          paths: |
            data/repo-profiles.json
            data/repo-profile-coverage.json
            data/repo-autocompletion-checklist.json
            data/_meta/repo-profiles.json

      - name: Annotate commit/push failure without failing enrichment
        if: steps.commit_data.outcome == 'failure'
        run: |
          echo "::warning::Refresh repo profiles data updated in-run, but commit/push failed (likely branch protection or push race)."
