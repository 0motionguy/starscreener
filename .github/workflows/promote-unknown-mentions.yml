name: Promote unknown mentions

# Daily compaction of data/unknown-mentions.jsonl into a ranked top-N JSON
# (data/unknown-mentions-promoted.json) for the admin discovery UI. Closes the
# discovery loop: hourly scrapers fill the lake, this job surfaces what they
# caught.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-unknown-mentions
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Promote top-N unknown mentions
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node scripts/promote-unknown-mentions.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          message: "chore(data): promote unknown mentions ${{ steps.ts.outputs.value }}"
          paths: |
            data/unknown-mentions-promoted.json
