name: Refresh MCP Smithery rank side-channel

# Manual-only until the MCP surface is rebuilt and HOSTUP-owned. Scheduled
# GitHub runs do not have production Redis/Smithery credentials and currently
# only publish noisy skipped-refresh runs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-smithery-rank-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/trendingrepo-worker
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/trendingrepo-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Publish MCP Smithery rank aggregate
        env:
          NODE_ENV: production
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: npm run fetcher -- mcp-smithery-rank
