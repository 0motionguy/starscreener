name: Refresh awesome-skills index

# Manual-only while the skill side-channel is retired from production
# freshness. Do not let GitHub own scheduled data writes for this source.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: awesome-skills-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape awesome-* skill lists
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node scripts/scrape-awesome-skills.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          actor-email: "bot@trendingrepo.com"
          message: "chore(data): refresh awesome-skills index ${{ steps.ts.outputs.value }}"
          paths: |
            data/awesome-skills.json
            data/_meta/awesome-skills.json
            data/unknown-mentions.jsonl
