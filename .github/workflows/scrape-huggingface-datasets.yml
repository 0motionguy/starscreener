name: Refresh HuggingFace dataset signals

# Every 3h at :25. Staggered from huggingface models (:13), spaces (:35),
# and arxiv (:43) so we don't all hit the HF API + git push at the same
# minute. HF's API is generous; 3h matches the trending half-life on the
# site without burning rate budget.
on:
  schedule:
    - cron: "25 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: huggingface-datasets-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh HuggingFace trending datasets
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Dual-write to TOOLBOX (trending.huggingface.datasets).
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
        run: node scripts/scrape-huggingface-datasets.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          actor-email: "bot@trendingrepo.com"
          message: "chore(data): refresh huggingface dataset signals ${{ steps.ts.outputs.value }}"
          paths: |
            data/huggingface-datasets.json
            data/_meta/huggingface-datasets.json
