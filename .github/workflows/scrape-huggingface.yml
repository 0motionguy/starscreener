name: Refresh HuggingFace signals

# Every 3h at :13. Staggered from arxiv (:43), lobsters (:37),
# bluesky (:17), and fast-discovery (:07/:27/:47) so we don't all hit
# upstream + git push at the same minute. HF's API is generous; 3h matches
# the trending half-life on the site without burning rate budget.
on:
  # Manual-only: HOSTUP worker/runtime owns production freshness; GitHub is kept for explicit backfills.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: huggingface-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh HuggingFace trending models
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Dual-write to TOOLBOX (trending.huggingface.models).
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
        run: node scripts/scrape-huggingface.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          actor-email: "bot@trendingrepo.com"
          message: "chore(data): refresh huggingface signals ${{ steps.ts.outputs.value }}"
          paths: |
            data/huggingface-trending.json
            data/_meta/huggingface.json
            data/unknown-mentions.jsonl
