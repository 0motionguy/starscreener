name: Refresh fast discovery

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # _data-store-write.mjs dynamically imports `ioredis` when REDIS_URL
        # is set on a step. Without node_modules the import throws
        # ERR_MODULE_NOT_FOUND and the whole pipeline fails. (Boundary:
        # PR #9 / 89273868, 2026-04-28T12:00Z added the import.)
        run: npm ci

      - name: Refresh OSSInsight trending + hot collections
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Dual-write to TOOLBOX signal lake (trending.github.repos).
          # Skipped silently when unset; never blocks the primary write.
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
        run: node scripts/scrape-trending.mjs --skip-collection-rankings

      - name: Discover recent GitHub repos
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/discover-recent-repos.mjs

      - name: Refresh Reddit mentions
        # NOT `continue-on-error: true`. The previous setting silently
        # masked a 2-day Reddit outage (root cause: `_load-env.mjs`
        # crashed importing `@next/env` which isn't installed in this
        # job). The script is now tolerant — but if it does fail we want
        # the workflow to surface red, not green-with-stale-data.
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_USER_AGENTS: ${{ secrets.REDDIT_USER_AGENTS }}
          # B1 (2026-05-16): activate Apify residential-proxy path so the
          # collector returns real score/num_comments instead of falling
          # through to the zero-engagement RSS path. Reddit's anti-bot
          # 403s every GH-runner IP for /r/X/new.json; Apify's
          # `trudax/reddit-scraper-lite` actor bypasses the block.
          REDDIT_COLLECTOR_PROVIDER: apify
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          # Dual-write to TOOLBOX signal lake (trending.reddit.mentions).
          # Skipped silently when unset; never blocks the primary write.
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
        run: node scripts/scrape-reddit.mjs

      - name: Refresh HackerNews trending + repo mentions
        # Firebase + Algolia public endpoints — no auth needed. Writes
        # data/hackernews-trending.json + data/hackernews-repo-mentions.json.
        # Wired into the fast-refresh loop so HN mentions feed cross-signal
        # on the same hourly cadence as Reddit (Sprint 1 finding #1).
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Dual-write to TOOLBOX signal lake (trending.hn.mentions).
          # Skipped silently when unset; never blocks the primary write.
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
        run: node scripts/scrape-hackernews.mjs

      - name: Refresh GitHub repo metadata
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-repo-metadata.mjs

      - name: Compute deltas from git history
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # Dual-write to TOOLBOX signal lake (trending.github.stars.velocity
          # + trending.github.fork.velocity when present).
          # Skipped silently when unset; never blocks the primary write.
          TOOLBOX_INGEST_URL: ${{ secrets.TOOLBOX_INGEST_URL }}
          TOOLBOX_INGEST_HMAC_SECRET: ${{ secrets.TOOLBOX_INGEST_HMAC_SECRET }}
        run: node scripts/compute-deltas.mjs

      - name: Snapshot star totals into rolling history (immediate-mode deltas)
        # W2-PROD producer: writes star-snapshot:{24h,7d,30d} keys consumed
        # by /api/pipeline/deltas. Drops home-page staleness from 4h (legacy
        # git-history compute-deltas.mjs) to 30min (cron cadence).
        # Failures don't fail the workflow — the legacy deltas pipeline above
        # still ships data, and the consumer falls back to prior=null/fresh=false
        # gracefully.
        continue-on-error: true
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node scripts/snapshot-stars.mjs

      - name: Snapshot per-category metrics into rolling history (W5-CATWINDOW)
        # Writes category-metrics-snapshot:{24h,7d,30d} keys consumed by the
        # /categories index + detail surfaces (loadCategoryMetricsPrev{1d,7d,30d}).
        # Cold-start safe: empty Map → UI falls back to lifetime totals.
        continue-on-error: true
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node scripts/snapshot-category-metrics.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          # Pass DATA_BOT_TOKEN so the auto-PR triggers required status
          # checks (workflow_run / pull_request). GITHUB_TOKEN-authored
          # PRs are suppressed by GitHub, which strands them at branch
          # protection. Empty/unset secret falls back to GITHUB_TOKEN
          # inside the action — see docs/DATA-BOT-PAT-SETUP.md.
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          message: "chore(data): refresh fast discovery snapshots ${{ steps.ts.outputs.value }}"
          paths: |
            data/trending.json
            data/trending-lite.json
            data/deltas.json
            data/hot-collections.json
            data/recent-repos.json
            data/repo-metadata.json
            data/reddit-mentions.json
            data/reddit-all-posts.json
            data/hackernews-trending.json
            data/hackernews-repo-mentions.json
            data/_meta/reddit.json
            data/_meta/hackernews.json
            data/_meta/trending.json
            data/unknown-mentions.jsonl
            .data/trending-dual-write-trace.jsonl

      - name: Reddit zero-data health check
        # Fails the workflow loudly when reddit-all-posts.json comes back
        # with posts:[] — the silent-zero failure mode is what let a
        # 2-day Reddit outage hide behind a green check earlier this
        # sprint. `if: always()` so the check still runs even if the
        # commit step skipped (no diff) or any prior step failed.
        if: always()
        run: |
          node -e "const d=require('./data/reddit-all-posts.json'); const n=d.posts?.length ?? 0; console.log('reddit posts:', n); if (n < 1) { console.error('ERROR: posts:[] — check collector logs and OAuth secrets'); process.exit(2); }"
