name: Secrets Scan (gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks workspace scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by the action, not used for repository writes.
          GITHUB_TOKEN: ${{ github.token }}
          # Scan the current workspace only to gate new leaked material in CI.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_COMMAND: detect
          GITLEAKS_ARGS: --source . --no-git --redact --verbose --exit-code 1
