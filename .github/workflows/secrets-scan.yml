name: Secrets Scan (gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks workspace scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Workspace-only scan — no git history needed.
          fetch-depth: 1

      # Install gitleaks directly instead of using gitleaks/gitleaks-action@v2.
      # The action ignores GITLEAKS_ARGS and forces a git-history scan, which
      # surfaces transient false positives in committed JSON catalogs (agent
      # IDs that look like API keys to the entropy heuristic) and treats the
      # .gitleaksignore file's commit-hash entries as new "leaks" — chicken
      # and egg. Running gitleaks ourselves with --no-git --source . scans
      # only the current workspace state, honors .gitleaks.toml path/regex
      # allowlists cleanly, and skips the .gitleaks.toml/.gitleaksignore
      # files themselves automatically.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --redact \
            --verbose \
            --exit-code 1
