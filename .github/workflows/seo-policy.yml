name: SEO Policy Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seo-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seo-policy:
    name: Fail on new page metadata drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: SEO policy lint (fail on new drift)
        run: node scripts/seo-policy-lint.mjs --fail-on-new
