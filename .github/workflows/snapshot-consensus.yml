name: Snapshot /consensus daily

# 23:55 UTC every day — captures the live `consensus-trending` and
# `consensus-verdicts` payloads to date-keyed Redis slots so historical
# views and the Early-Call Hall of Fame can walk back N days.
# 90-day TTL on the destination keys.
on:
  # Manual-only: HOSTUP worker/runtime owns production freshness; GitHub is kept for explicit backfills.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consensus-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Hard cap so a hung Redis read can't burn the GH Actions 6h budget.
    # Belt; suspenders is the ioredis commandTimeout in src/lib/data-store.ts.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Capture consensus daily snapshot
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npm run snapshot:consensus
