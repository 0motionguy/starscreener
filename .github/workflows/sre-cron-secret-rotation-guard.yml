name: SRE - CRON_SECRET Rotation Guard

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: sre-cron-secret-rotation-guard
  cancel-in-progress: true

jobs:
  enforce-rotation-window:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAX_AGE_DAYS: "90"
      SECRET_NAME: "CRON_SECRET"
      GH_TOKEN: ${{ secrets.GH_PAT_DEFAULT || github.token }}
    steps:
      - name: Read secret metadata
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/secrets/${SECRET_NAME}" > secret.json

      - name: Enforce max age
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const payload = JSON.parse(fs.readFileSync('secret.json', 'utf8'));
            const updatedAtRaw = payload.updated_at;
            if (!updatedAtRaw) {
              console.error('secret metadata missing updated_at');
              process.exit(2);
            }
            const updatedAt = new Date(updatedAtRaw);
            const now = new Date();
            const ageMs = now.getTime() - updatedAt.getTime();
            const ageDays = Math.floor(ageMs / 86400000);
            const maxAgeDays = Number(process.env.MAX_AGE_DAYS || 90);
            const summary = [
              '## CRON_SECRET Rotation Guard',
              '',
              '| key | value |',
              '|---|---|',
              '| secret | ' + payload.name + ' |',
              '| updated_at (UTC) | ' + updatedAt.toISOString() + ' |',
              '| age_days | ' + ageDays + ' |',
              '| max_age_days | ' + maxAgeDays + ' |'
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
            if (ageDays > maxAgeDays) {
              console.error('CRON_SECRET age exceeded rotation window: ' + ageDays + 'd > ' + maxAgeDays + 'd');
              process.exit(1);
            }
            console.log('CRON_SECRET age within rotation window: ' + ageDays + 'd <= ' + maxAgeDays + 'd');
          "

      - name: Attach metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: cron-secret-rotation-guard
          path: secret.json
          retention-days: 14
