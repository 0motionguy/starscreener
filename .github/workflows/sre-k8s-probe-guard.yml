name: SRE - Kubernetes probe guard

on:
  pull_request:
    paths:
      - "k8s/**/*.yml"
      - "k8s/**/*.yaml"
      - "infra/k8s/**/*.yml"
      - "infra/k8s/**/*.yaml"
      - "deploy/**/*.yml"
      - "deploy/**/*.yaml"
      - "helm/**/*.yml"
      - "helm/**/*.yaml"
  push:
    branches: [main]
    paths:
      - "k8s/**/*.yml"
      - "k8s/**/*.yaml"
      - "infra/k8s/**/*.yml"
      - "infra/k8s/**/*.yaml"
      - "deploy/**/*.yml"
      - "deploy/**/*.yaml"
      - "helm/**/*.yml"
      - "helm/**/*.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sre-k8s-probe-guard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install parser
        run: python3 -m pip install --quiet pyyaml

      - name: Validate probe hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys
          import yaml

          CANDIDATE_ROOTS = ["k8s", "infra/k8s", "deploy", "helm"]
          WORKLOAD_KINDS = {"Deployment", "StatefulSet", "DaemonSet"}
          REQUIRED_PROBES = ("readinessProbe", "livenessProbe")
          REQUIRED_FIELDS = ("timeoutSeconds", "periodSeconds", "failureThreshold")
          PROBE_HANDLERS = ("httpGet", "tcpSocket", "exec", "grpc")

          def is_manifest(path: str) -> bool:
              return path.endswith((".yml", ".yaml"))

          def iter_manifest_files():
              for root in CANDIDATE_ROOTS:
                  if not os.path.isdir(root):
                      continue
                  for dirpath, _, filenames in os.walk(root):
                      for fn in filenames:
                          path = os.path.join(dirpath, fn)
                          if is_manifest(path):
                              yield path

          files = sorted(set(iter_manifest_files()))
          if not files:
              print("No Kubernetes manifest roots found (k8s/infra-k8s/deploy/helm). Guard noop.")
              sys.exit(0)

          errors = []
          warnings = []
          scanned_workloads = 0

          def check_probe(path, kind, container_name, probe_name, probe):
              if not isinstance(probe, dict):
                  errors.append(f"{path}: {kind}/{container_name} {probe_name} must be an object")
                  return
              if not any(k in probe for k in PROBE_HANDLERS):
                  errors.append(
                      f"{path}: {kind}/{container_name} {probe_name} missing handler "
                      f"(one of {', '.join(PROBE_HANDLERS)})"
                  )
              for field in REQUIRED_FIELDS:
                  if field not in probe:
                      errors.append(f"{path}: {kind}/{container_name} {probe_name} missing {field}")

          for path in files:
              with open(path, "r", encoding="utf-8") as f:
                  try:
                      docs = list(yaml.safe_load_all(f))
                  except Exception as exc:
                      errors.append(f"{path}: YAML parse error: {exc}")
                      continue

              for doc in docs:
                  if not isinstance(doc, dict):
                      continue
                  kind = doc.get("kind")
                  if kind not in WORKLOAD_KINDS:
                      continue
                  scanned_workloads += 1
                  spec = (doc.get("spec") or {})
                  template = (spec.get("template") or {})
                  pod_spec = (template.get("spec") or {})
                  containers = (pod_spec.get("containers") or []) + (pod_spec.get("initContainers") or [])
                  if not containers:
                      errors.append(f"{path}: {kind} has no containers/initContainers")
                      continue
                  for c in containers:
                      cname = c.get("name", "<unnamed>")
                      for probe_name in REQUIRED_PROBES:
                          probe = c.get(probe_name)
                          if probe is None:
                              errors.append(f"{path}: {kind}/{cname} missing {probe_name}")
                          else:
                              check_probe(path, kind, cname, probe_name, probe)
                      startup = c.get("startupProbe")
                      if startup is None:
                          warnings.append(f"{path}: {kind}/{cname} missing startupProbe (recommended)")
                      else:
                          check_probe(path, kind, cname, "startupProbe", startup)

          if scanned_workloads == 0:
              print("No Deployment/StatefulSet/DaemonSet docs found in manifest roots. Guard noop.")
              sys.exit(0)

          for w in warnings:
              print(f"::warning::{w}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              print(f"Probe hardening check failed with {len(errors)} error(s).")
              sys.exit(1)

          print(f"Probe hardening check passed for {scanned_workloads} workload manifest(s).")
          PY
