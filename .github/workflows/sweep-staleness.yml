name: Sweep staleness

# Daily 02:00 UTC sweep over per-source records to flag entries past
# `cadence × 2`. Writes data/staleness-report.json which the
# /admin/staleness page renders. Stale records here are *not* removed —
# this is a diagnostic, not a janitor. The actual rescrape pipeline owns
# refresh; the sweep just makes laggards visible to ops.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sweep-staleness
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # GitHub-hosted runners start with an empty workspace. The sweeper
        # itself is tiny, but the Redis writer dynamically imports ioredis
        # when REDIS_URL is set.
        run: npm ci

      - name: Run sweeper
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node scripts/sweep-staleness.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          actor-email: "bot@trendingrepo.com"
          message: "chore(data): refresh staleness report ${{ steps.ts.outputs.value }}"
          paths: |
            data/staleness-report.json
