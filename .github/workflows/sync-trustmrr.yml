name: Sync TrustMRR revenue overlays

on:
  # Manual-only: HOSTUP worker/runtime owns production freshness; GitHub is kept for explicit backfills.
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode (full or incremental)"
        required: false
        default: "incremental"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-trustmrr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # _data-store-write.mjs dynamically imports `ioredis` when REDIS_URL
        # is set on a step. Without node_modules the import throws
        # ERR_MODULE_NOT_FOUND. (Boundary: PR #9 / 89273868.)
        run: npm ci

      - name: Decide mode
        id: mode
        run: |
          # One full catalog sweep per day at :27 UTC (hour 02). Every other
          # :27 run is incremental — cheap re-match against the cached
          # catalog, zero external API calls. This must match the block
          # comment on the cron schedule above; earlier versions promoted
          # 08/14/20 to full and were spending ~4x the API budget silently.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            case "$HOUR" in
              02) echo "mode=full" >> "$GITHUB_OUTPUT" ;;
              *)  echo "mode=incremental" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Sync TrustMRR catalog + derive overlays
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TRUSTMRR_API_KEY: ${{ secrets.TRUSTMRR_API_KEY }}
        run: node scripts/sync-trustmrr.mjs --mode=${{ steps.mode.outputs.mode }}

      - name: Recompute benchmarks (full sweep only)
        if: steps.mode.outputs.mode == 'full'
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node scripts/compute-revenue-benchmarks.mjs

      - name: Compute commit timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Commit if changed
        # Step-level timeout — git-commit-data invokes `gh pr merge --auto`
        # which can block indefinitely waiting for required checks. Cap at
        # 5 min so the rest of the job (which may run other workloads) isn't
        # starved. Pattern source: #1529 (collect-twitter.yml).
        timeout-minutes: 5
        uses: ./.github/actions/git-commit-data
        with:
          gh-token: ${{ secrets.DATA_BOT_TOKEN }}
          message: "chore(data): refresh trustmrr overlays ${{ steps.ts.outputs.value }}"
          paths: |
            data/trustmrr-startups.json
            data/revenue-overlays.json
            data/revenue-benchmarks.json
