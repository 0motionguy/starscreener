name: trendingrepo-worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/trendingrepo-worker/**'
      - '.github/workflows/trendingrepo-worker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/trendingrepo-worker/**'
      - '.github/workflows/trendingrepo-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/trendingrepo-worker
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/trendingrepo-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (excluding SQL parity which needs Supabase local)
        run: npx vitest run --exclude tests/sql/**
