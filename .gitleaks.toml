# Gitleaks config — extends the default ruleset with allowlists for
# false positives in curated catalog files. Real secrets live in .env
# (gitignored), GitHub Actions secrets, and Vercel env vars.
title = "trendingrepo gitleaks config"

[extend]
useDefault = true

# Top-level singular [allowlist] form (gitleaks v8.0+). Path-matched
# files are exempted from ALL rules (use --target/regex form for
# narrower scoping if needed in the future).
[allowlist]
description = "Curated catalog files: agent IDs and natural-language descriptions trip the generic-api-key entropy heuristic"
paths = [
  '''data/agent-commerce\.json''',
]
