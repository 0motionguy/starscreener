# Gitleaks config — extends the default ruleset with allowlists for
# false positives in curated catalog files. Real secrets live in .env
# (gitignored), GitHub Actions secrets, and Vercel env vars.
title = "trendingrepo gitleaks config"

[extend]
useDefault = true

# Top-level singular [allowlist] form (gitleaks v8.0+). Path-matched
# files are exempted from ALL rules (use --target/regex form for
# narrower scoping if needed in the future).
[allowlist]
description = "Curated catalog + meta files where commit hashes / agent IDs / natural-language descriptions trip the generic-api-key entropy heuristic"
paths = [
  '''data/agent-commerce\.json''',
  '''data/repo-mentions-detail\.jsonl''',
  '''\.data/aiso-rescan-queue\.jsonl''',
  '''\.data/twitter-scans\.jsonl''',
  # Commit-prefixed fingerprint format contains 40-char SHA-1 hashes
  # that look like API keys to gitleaks. The .gitleaksignore file from
  # commit afae93e5 has been removed in a later commit (885986af) but
  # still exists in the PR's git-history scan range.
  '''\.gitleaksignore$''',
  # Test fixtures for the secret-scrubber utility (apps/trendingrepo-worker/
  # src/lib/secret-scrubber.ts). The whole point of this test file is to
  # verify the scrubber redacts realistic-looking aws/gcp/github tokens —
  # they MUST look real or the test is meaningless. 10 intentional
  # false-positives (aws-access-token, gcp-api-key, github-pat,
  # github-app-token, generic-api-key) live here as the inputs the
  # scrubber must catch.
  '''apps/trendingrepo-worker/src/lib/__tests__/secret-scrubber\.test\.ts$''',
]

regexes = [
  # PostHog project ingest keys are intentionally public. They are embedded in
  # browser bundles and can only write analytics events.
  '''phc_[A-Za-z0-9]{30,}''',
  # Deterministic test-only cron token literals used to avoid auth fallback
  # masking assertions.
  '''test-cron-secret-[A-Za-z0-9]+''',
  # Identifier names that trip generic entropy rules.
  '''apify\.(fail24h|success24h)''',
  '''starVelocity(24h|7d)''',
  '''forkVelocity7d''',
  '''contributorGrowth30d''',
  '''TwitterMatchedPostPreview''',
]
