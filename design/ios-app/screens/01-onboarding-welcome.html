<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1,viewport-fit=cover">
<title>Welcome — Trending Repos</title>
<style>
  :root{
    --bg:#000; --elev-1:#1c1c1e; --elev-2:#2c2c2e; --elev-3:#3a3a3c;
    --label:#fff; --label-2:rgba(235,235,245,.60); --label-3:rgba(235,235,245,.30); --label-4:rgba(235,235,245,.18);
    --fill-3:rgba(118,118,128,.16);
    --sep:rgba(84,84,88,.30);
    --accent:#ff6b35; --accent-soft:rgba(255,107,53,.16); --accent-glow:rgba(255,107,53,.45);
    --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
    --f-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
    --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{width:390px;height:844px;background:var(--bg);color:var(--label);font-family:var(--f-text);font-size:17px;line-height:1.41;letter-spacing:-.014em;overflow:hidden;position:relative;}

  body::before{
    content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);
    width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,107,53,.22) 0%,rgba(255,107,53,.06) 35%,transparent 65%);
    filter:blur(50px);pointer-events:none;z-index:0;
  }

  .status-bar{height:54px;padding:18px 30px 0;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:600;letter-spacing:-.4px;position:relative;z-index:10;}
  .status-bar .time{font-variant-numeric:tabular-nums;}
  .status-bar .sys{display:flex;align-items:center;gap:5px;}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:37px;background:#000;border-radius:99px;z-index:20;pointer-events:none;}
  .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:99px;background:#fff;opacity:.85;z-index:25;}

  .screen{position:relative;width:100%;height:100%;display:flex;flex-direction:column;z-index:1;}

  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px 32px;position:relative;}
  .mark-wrap{position:relative;}
  .mark-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);filter:blur(20px);}
  .mark{position:relative;width:104px;height:104px;border-radius:26px;background:linear-gradient(135deg,#ff9966 0%,#ff6b35 100%);display:grid;place-items:center;box-shadow:0 20px 60px -12px rgba(255,107,53,.55),inset 0 1.5px 0 rgba(255,255,255,.30),inset 0 0 0 1px rgba(255,255,255,.10);}
  .mark svg{width:52px;height:52px;}

  .hero-stat{margin-top:36px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(255,255,255,.04);border:.5px solid var(--sep);border-radius:99px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
  .hero-stat .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .hero-stat .txt{font-family:var(--f-mono);font-size:11.5px;color:var(--label-2);letter-spacing:.02em;font-variant-numeric:tabular-nums;}
  .hero-stat .txt b{color:var(--label);font-weight:600;}

  .copy{padding:0 32px 0;}
  .copy h1{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;color:var(--label);margin-bottom:14px;}
  .copy h1 .em{color:var(--accent);}
  .copy .lede{font-size:17px;line-height:1.43;letter-spacing:-.4px;color:var(--label-2);max-width:320px;}

  .footer{padding:24px 16px 60px;}
  .btn-primary{
    width:100%;height:52px;border:0;border-radius:14px;
    background:#fff;color:#000;
    font-family:var(--f-text);font-size:17px;font-weight:600;letter-spacing:-.4px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:active{transform:scale(.985);opacity:.85;}
  .btn-link{
    width:100%;height:44px;background:none;border:0;
    color:var(--label-2);font-size:15px;font-weight:500;letter-spacing:-.24px;
    margin-top:6px;cursor:pointer;
  }
  .btn-link b{color:var(--accent);font-weight:600;}

  .dots{display:flex;justify-content:center;gap:5px;margin-top:20px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--label-4);transition:all .25s ease;}
  .dot.active{background:var(--accent);width:20px;border-radius:99px;}
</style>
</head>
<body>
  <div class="island"></div>
  <header class="status-bar">
    <span class="time">9:41</span>
    <span class="sys">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="6" width="3" height="5" rx=".5"/><rect x="4.5" y="4" width="3" height="7" rx=".5"/><rect x="9" y="2" width="3" height="9" rx=".5"/><rect x="13.5" y="0" width="3" height="11" rx=".5"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#fff"><path d="M7.5 0C4.7 0 2.1 1 0 2.7L1.4 4.1C3.1 2.8 5.2 2 7.5 2C9.8 2 11.9 2.8 13.6 4.1L15 2.7C12.9 1 10.3 0 7.5 0ZM7.5 4C5.7 4 4.1 4.6 2.8 5.7L4.2 7.1C5.1 6.4 6.3 6 7.5 6C8.7 6 9.9 6.4 10.8 7.1L12.2 5.7C10.9 4.6 9.3 4 7.5 4ZM7.5 8C6.7 8 6 8.3 5.4 8.8L7.5 11L9.6 8.8C9 8.3 8.3 8 7.5 8Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="#fff" stroke-opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2" fill="#fff"/><rect x="23.5" y="4" width="1.5" height="5" rx=".7" fill="#fff" fill-opacity=".4"/></svg>
    </span>
  </header>

  <div class="screen">
    <div class="hero">
      <div class="mark-wrap">
        <div class="mark-glow"></div>
        <div class="mark">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M5 22 L12 15 L17 19 L27 8" stroke="#1a0a04" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 8 H27 V13" stroke="#1a0a04" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="hero-stat">
        <span class="pulse"></span>
        <span class="txt"><b>2,481</b> repos trending right now</span>
      </div>
    </div>

    <div class="copy">
      <h1>Catch what's<br/>trending <span class="em">before</span><br/>it does.</h1>
      <p class="lede">Discover repos. Watch movers. Get alerted before the world catches on.</p>
    </div>

    <div class="footer">
      <button class="btn-primary">Get Started</button>
      <button class="btn-link">I already have an account · <b>Sign in</b></button>
      <div class="dots"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
  </div>

  <div class="home-indicator"></div>
</body>
</html>
