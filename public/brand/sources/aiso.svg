<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="AISO mark">
  <title>AISO mark</title>
  <rect width="64" height="64" rx="2" fill="#ff5e1a"/>
  <g transform="rotate(-90 32 32)">
    <circle cx="32" cy="32" r="20" stroke="#f7f0df" stroke-opacity="0.35" stroke-width="3.5" fill="none"/>
    <circle cx="32" cy="32" r="20" stroke="#f7f0df" stroke-width="3.5" fill="none"
            stroke-linecap="round" stroke-dasharray="100 26"/>
  </g>
  <text x="32" y="40" font-family="'Fraunces', Georgia, serif" font-style="italic" font-weight="600" font-size="30" fill="#0a0a0a" text-anchor="middle" letter-spacing="-0.5">a</text>
</svg>
